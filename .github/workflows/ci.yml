name: Barq-AI CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-ai-engine:
    name: Test Barq-AI Engine (FastAPI & Benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd services/api
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Pytest Suite
        run: |
          cd services/api
          uv run pytest -v

      - name: Run Benchmark Evaluation
        run: |
          cd services/api
          python -m app.ai.eval_suite --compare
